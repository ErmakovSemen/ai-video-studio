</div>

<script src="timing.js"></script>
<script src="engine.js"></script>
<script src="engrave.js"></script>
<script src="collage.js"></script>
<script src="scenes.js"></script>
<script>
  const st = { t: 0 };
  SCENES.init('kraft', document.getElementById('cv'));
  const tl = gsap.timeline({ paused: true });
  tl.to(st, { t: T.duration, duration: T.duration, ease: 'none', onUpdate: () => SCENES.render(st.t) }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  tl.seek(0);
  SCENES.render(0);
  Promise.all([document.fonts.load('40px R_Oswald'), document.fonts.load('40px R_Playfair'), document.fonts.load('40px R_RubikMono'), document.fonts.load('40px R_Russo'), document.fonts.load('40px R_Yeseva'), document.fonts.load('40px R_Ruslan'), document.fonts.load('40px R_Lobster'), document.fonts.load('40px R_Unbounded'), document.fonts.load('40px R_Kelly'), document.fonts.load('40px R_Plex'), document.fonts.load('40px R_Alice'), document.fonts.load('40px R_Prata'), document.fonts.load('40px R_Cormorant'), document.fonts.load('40px R_Mono'), document.fonts.load('40px Hand'), document.fonts.load('40px Glyph')]).then(() => { COLLAGE.reset(); SCENES.render(st.t); });
</script>

</html>

<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кошелёк · Прометей</title>
<link rel="stylesheet" href="/static/ds.css">
<style>
body{padding:26px 20px 70px}
.wrap{max-width:820px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;margin-bottom:14px}
.back:hover{color:var(--txt)}
h1{font-size:24px;margin:0 0 5px}
.sub{color:var(--mut);font-size:13px;margin:0 0 22px}
.balrow{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:18px}
.balcard{padding:20px 22px}
.ballbl{font-size:12px;color:var(--mut);margin-bottom:6px}
.balval{font-family:var(--head);font-size:34px;font-weight:700;letter-spacing:-.02em}
.balhint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
.card{padding:20px 22px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:14px}
.amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.am{font-family:var(--mono);font-size:12px;color:var(--mut);background:var(--panel-2);
  border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.14s}
.am:hover{border-color:var(--ember);color:var(--txt)}
.am.on{border-color:var(--ember);color:var(--ember);background:rgba(255,122,69,.08)}
.calc{background:var(--void);border:1px solid var(--line-2);border-radius:10px;padding:13px 15px;margin-top:14px;font-size:13px}
.calc .r{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}
.calc .r b{color:var(--txt);font-weight:500}
.calc .r.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:15px}
.calc .r.tot b{font-family:var(--head);font-weight:700}
.calc .ok{color:var(--ok)}
.promo-row{display:flex;gap:9px}
.promo-row input{flex:1;text-transform:uppercase}
.promo-row input::placeholder{text-transform:none}
.tx{border-top:1px solid var(--line)}
.tx .row2{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.tx .row2:last-child{border-bottom:0}
.tx .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--panel-2);border:1px solid var(--line-2)}
.tx .ic svg{width:15px;height:15px}
.tx .up{color:var(--ok)}.tx .dn{color:var(--mut)}
.tx .nm{flex:1;min-width:0}
.tx .nm b{display:block;font-weight:500}
.tx .nm span{font-size:11px;color:var(--faint);font-family:var(--mono)}
.tx .amt{font-family:var(--head);font-weight:600;white-space:nowrap}
.tx .amt.plus{color:var(--ok)}
.pending{background:rgba(255,207,92,.08);border:1px solid rgba(255,207,92,.3);border-radius:11px;padding:13px 15px;margin-bottom:12px}
.pending .between{margin-bottom:8px}
.pending .lbl{font-size:13px;color:#ffe0a3}
.pending .acts{display:flex;gap:8px}
.pending button{font-size:12px;padding:7px 13px;border-radius:8px;cursor:pointer;border:1px solid var(--line-2);background:var(--panel-2);color:var(--txt)}
.pending button.ok{border-color:var(--ok);color:var(--ok)}
.note{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:12px}
.empty{color:var(--faint);font-size:13px;padding:16px 0}
@media (max-width:680px){.balrow{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
  <a class="back" href="/cabinet">← Кабинет</a>
  <h1>Кошелёк</h1>
  <p class="sub">Баланс, из которого списывается генерация. Пополняйте прямо здесь.</p>

  <div class="balrow">
    <div class="pcard balcard">
      <div class="ballbl">Баланс</div>
      <div class="balval" id="bal">— ₽</div>
      <div class="balhint" id="balHint"></div>
    </div>
    <div class="pcard balcard">
      <div class="ballbl">Стоимость операций</div>
      <div id="prices" style="font-size:13px;color:var(--txt-2);line-height:1.9"></div>
    </div>
  </div>

  <div id="pendingWrap"></div>

  <div class="pcard card">
    <h3>Пополнить</h3>
    <div class="amounts" id="amounts"></div>
    <label>Сумма, ₽</label>
    <input type="number" id="amount" value="1000" min="100" step="100">
    <label style="margin-top:14px">Промокод</label>
    <div class="promo-row">
      <input type="text" id="promo" placeholder="если есть">
      <button class="btn btn-ghost" id="applyPromo" style="padding:11px 16px;white-space:nowrap">Применить</button>
    </div>
    <div class="calc" id="calc"></div>
    <button class="btn btn-primary btn-block" id="topup" style="margin-top:16px">Пополнить</button>
    <div class="note" id="payNote"></div>
  </div>

  <div class="pcard card">
    <h3>История операций</h3>
    <div class="tx" id="tx"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const SVG={up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
           dn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>'};
let FEE=5,PRICE={};

function fmt(n){return (n||0).toLocaleString('ru')}
function plural(n,one,few,many){const m=n%100;if(m>=11&&m<=14)return many;
  const k=n%10;return k===1?one:(k>=2&&k<=4?few:many)}
function tsfmt(t){const d=new Date(t*1000);return d.toLocaleDateString('ru',{day:'numeric',month:'short'})+' '+d.toTimeString().slice(0,5)}

async function load(){
  const w=await(await fetch('/api/wallet')).json();
  FEE=w.fee_pct;PRICE=w.price;
  $('#bal').textContent=fmt(w.balance)+' ₽';
  const n=Math.floor(w.balance/(PRICE.video||39));
  $('#balHint').textContent=w.balance>0?`Хватит примерно на ${n} ${plural(n,'ролик','ролика','роликов')}`:'Пополните, чтобы создавать ролики';
  $('#prices').innerHTML=`Ролик — <b>${PRICE.video} ₽</b><br>Нейромонтаж — <b>${PRICE.montage} ₽</b><br>Нарезка на Shorts — <b>${PRICE.clip} ₽</b>`;
  // ожидающие пополнения
  $('#pendingWrap').innerHTML=(w.pending||[]).map(p=>`
    <div class="pending">
      <div class="between"><span class="lbl">Ожидает оплаты: ${fmt(p.to_pay)} ₽ → зачислим ${fmt(p.to_credit)} ₽</span></div>
      <div class="acts">
        <button class="ok" onclick="confirmTopup('${p.id}')">Я оплатил — зачислить</button>
        <button onclick="cancelTopup('${p.id}')">Отменить</button>
      </div>
    </div>`).join('');
  // история
  const tx=w.tx||[];
  $('#tx').innerHTML=tx.length?tx.map(t=>`
    <div class="row2">
      <div class="ic ${t.amount>0?'up':'dn'}">${t.amount>0?SVG.up:SVG.dn}</div>
      <div class="nm"><b>${t.note||t.kind}</b><span>${tsfmt(t.ts)}</span></div>
      <div class="amt ${t.amount>0?'plus':''}">${t.amount>0?'+':''}${fmt(t.amount)} ₽</div>
    </div>`).join(''):'<div class="empty">Пока операций не было.</div>';
  recalc();
}

let calcTimer;
async function recalc(){
  clearTimeout(calcTimer);
  calcTimer=setTimeout(async()=>{
    const amount=+$('#amount').value||0, promo=$('#promo').value.trim();
    try{
      const q=await(await fetch(`/api/wallet/quote?amount=${amount}&promo=${encodeURIComponent(promo)}`)).json();
      const pr=q.promo;
      $('#calc').innerHTML=`
        <div class="r"><span>Пополнение</span><b>${fmt(q.amount)} ₽</b></div>
        <div class="r"><span>Комиссия сервиса ${q.fee_pct}%</span><b class="${q.fee===0?'ok':''}">${q.fee===0?'0 ₽':fmt(q.fee)+' ₽'}</b></div>
        ${q.bonus?`<div class="r"><span>Бонус по промокоду</span><b class="ok">+${fmt(q.bonus)} ₽</b></div>`:''}
        ${pr&&!pr.valid&&pr.reason?`<div class="r"><span style="color:var(--bad)">${pr.reason}</span></div>`:''}
        ${pr&&pr.valid?`<div class="r"><span class="ok">Промокод применён</span></div>`:''}
        <div class="r tot"><span>К оплате</span><b>${fmt(q.to_pay)} ₽</b></div>
        <div class="r"><span>Зачислим на баланс</span><b>${fmt(q.to_credit)} ₽</b></div>`;
    }catch(_){}
  },250);
}
$('#amount').oninput=recalc;
$('#applyPromo').onclick=recalc;
$('#promo').addEventListener('keydown',e=>{if(e.key==='Enter')recalc()});

$('#amounts').innerHTML=[500,1000,3000,10000].map(a=>`<span class="am" data-a="${a}">${fmt(a)} ₽</span>`).join('');
document.querySelectorAll('.am').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.am').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');$('#amount').value=el.dataset.a;recalc();
});

$('#topup').onclick=async()=>{
  const b=$('#topup');b.disabled=true;b.textContent='Создаю счёт…';
  const fd=new FormData();
  fd.append('amount',$('#amount').value);fd.append('promo',$('#promo').value.trim());
  try{
    const r=await fetch('/api/wallet/topup',{method:'POST',body:fd});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'не удалось');
    $('#payNote').innerHTML=`Счёт на <b>${fmt(j.to_pay)} ₽</b> создан. Оплатите его — и нажмите «Я оплатил», чтобы средства зачислились.`;
    await load();
  }catch(e){$('#payNote').textContent='Ошибка: '+e.message}
  b.disabled=false;b.textContent='Пополнить';
};

async function confirmTopup(id){
  const fd=new FormData();fd.append('id',id);
  await fetch('/api/wallet/confirm',{method:'POST',body:fd});load();
}
async function cancelTopup(id){
  const fd=new FormData();fd.append('id',id);
  await fetch('/api/wallet/cancel',{method:'POST',body:fd});load();
}
load();
</script>
</body></html>
